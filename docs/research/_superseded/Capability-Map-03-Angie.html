<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream OS Capability Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
<style id="app-style">
*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light;
  --paper:      #F4F6F3;
  --surface:    #FFFFFF;
  --surface-2:  #EDF1EE;
  --line:       #D9DFDA;
  --line-soft:  #E8ECE8;
  --ink:        #14201E;
  --muted:      #596763;
  --faint:      #8D9995;
  --accent:     #0E6E63;
  --accent-ink: #0A544B;
  --accent-soft:#DCEBE7;
  --amber:      #96661A;
  --amber-soft: #F3E7D2;
  --slate:      #5D6E79;
  --slate-soft: #E3E9EC;
  --shadow:     0 1px 2px rgba(20,32,30,.06), 0 8px 24px rgba(20,32,30,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper:      #0E1517;
    --surface:    #151D20;
    --surface-2:  #1B2529;
    --line:       #2A363A;
    --line-soft:  #212B2F;
    --ink:        #E7EDEA;
    --muted:      #9BA9A5;
    --faint:      #6D7B78;
    --accent:     #43B5A5;
    --accent-ink: #6FCFC1;
    --accent-soft:#14322E;
    --amber:      #D6A44E;
    --amber-soft: #33291A;
    --slate:      #93A5B0;
    --slate-soft: #202C32;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:      #0E1517;
  --surface:    #151D20;
  --surface-2:  #1B2529;
  --line:       #2A363A;
  --line-soft:  #212B2F;
  --ink:        #E7EDEA;
  --muted:      #9BA9A5;
  --faint:      #6D7B78;
  --accent:     #43B5A5;
  --accent-ink: #6FCFC1;
  --accent-soft:#14322E;
  --amber:      #D6A44E;
  --amber-soft: #33291A;
  --slate:      #93A5B0;
  --slate-soft: #202C32;
  --shadow:     0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px 96px; }

/* ---------- masthead ---------- */
.masthead { padding: 40px 0 24px; border-bottom: 1px solid var(--line); }
.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 10px;
}
h1 {
  font-family: Spectral, Georgia, serif;
  font-weight: 600; font-size: clamp(30px, 4.2vw, 44px);
  line-height: 1.08; letter-spacing: -.015em;
  margin: 0 0 12px; text-wrap: balance;
}
.standfirst { max-width: 66ch; color: var(--muted); font-size: 15px; margin: 0; }
.standfirst strong { color: var(--ink); font-weight: 600; }

/* ---------- summary ---------- */
.summary {
  display: grid; gap: 12px; margin: 24px 0 0;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 3px; padding: 12px 14px;
}
.stat .k {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  display: block; margin-bottom: 4px;
}
.stat .v {
  font-family: Spectral, Georgia, serif; font-size: 26px; font-weight: 600;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.stat.is-must .v { color: var(--accent); }
.stat.is-nice .v { color: var(--amber); }
.stat.is-no .v   { color: var(--faint); }

.progress { margin-top: 14px; }
.progress .bar {
  height: 5px; border-radius: 3px; background: var(--surface-2);
  overflow: hidden; display: flex;
}
.progress .bar i { display: block; height: 100%; }
.progress .bar .p-must { background: var(--accent); }
.progress .bar .p-nice { background: var(--amber); }
.progress .bar .p-no   { background: var(--faint); }
.progress .cap {
  margin-top: 7px; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ---------- toolbar ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 14px 0; margin-top: 24px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.field {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 3px; padding: 0 10px; height: 34px;
}
.field label {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
}
.field input, .field select {
  border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 13px; outline: none; height: 32px;
  min-width: 0;
}
.field input { width: 210px; }
.field select { cursor: pointer; }
.spacer { flex: 1 1 auto; }

button {
  font: inherit; cursor: pointer; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 3px; height: 34px; padding: 0 13px; font-size: 13px;
}
button:hover { border-color: var(--accent); }
button:focus-visible, .field:focus-within,
.seg button:focus-visible, .note:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}

.savechip {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  color: var(--faint); letter-spacing: .04em; white-space: nowrap;
  min-width: 120px; text-align: right;
}
.savechip.is-on { color: var(--accent); }
.savechip.is-warn { color: var(--amber); }

/* ---------- table ---------- */
.tablewrap {
  margin-top: 18px;
  max-height: calc(100vh - 96px);
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--line); border-radius: 3px;
  background: var(--surface);
}
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1080px; }

thead th {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  text-align: left; vertical-align: bottom;
  padding: 11px 10px; font-weight: 600; font-size: 12px;
}
thead th .sub {
  display: block; font-family: "IBM Plex Mono", monospace;
  font-size: 10px; font-weight: 400; color: var(--faint);
  letter-spacing: .04em; margin-top: 3px;
}
thead th.vend, thead th.dream { text-align: center; width: 108px; }
thead th.dream { width: 122px; }
thead th.dec { width: 190px; }
thead th.note-h { width: 150px; }

th.cap-h, td.cap {
  position: sticky; left: 0; z-index: 10;
  background: var(--surface); min-width: 330px; width: 330px;
}
thead th.cap-h { z-index: 25; background: var(--surface-2); }
td.cap { border-right: 1px solid var(--line-soft); }

tbody tr:hover td { background: var(--surface-2); }
tbody tr.decided td.cap { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.decided-nice td.cap { box-shadow: inset 3px 0 0 var(--amber); }
tbody tr.decided-no td.cap { box-shadow: inset 3px 0 0 var(--faint); }

td { padding: 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
td.vend, td.dreamc { text-align: center; }

.cap .name { font-weight: 500; }
.cap .why { color: var(--muted); font-size: 12.5px; margin-top: 2px; max-width: 46ch; }
.rowid {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  color: var(--faint); margin-right: 7px;
}

/* group headers */
tr.group td {
  background: var(--paper); border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line); padding: 9px 10px;
  position: sticky; left: 0;
}
tr.group .gname {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  font-weight: 500;
}
tr.group .gcount { color: var(--faint); font-family: "IBM Plex Mono", monospace; font-size: 11px; }

/* coverage marks */
.cov { font-size: 15px; line-height: 1; display: inline-block; }
.cov-2 { color: var(--accent); }
.cov-1 { color: var(--accent); opacity: .62; }
.cov-0 { color: var(--faint); opacity: .5; }
.cov-u { color: var(--faint); font-family: "IBM Plex Mono", monospace; font-size: 12px; }

/* dream chip */
.chip {
  display: inline-block; font-family: "IBM Plex Mono", monospace;
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 2px; border: 1px solid transparent;
  white-space: nowrap;
}
.chip-built   { background: var(--accent-soft); color: var(--accent-ink); }
.chip-partial { background: var(--amber-soft); color: var(--amber); }
.chip-planned { background: var(--slate-soft); color: var(--slate); }
.chip-absent  { border-color: var(--line); color: var(--faint); border-style: dashed; }
.chip-na      { color: var(--faint); }

/* decision control */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button {
  border: 0; border-radius: 0; height: 27px; padding: 0 9px;
  font-size: 11.5px; background: var(--surface); color: var(--muted);
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--surface-2); color: var(--ink); }
.seg button[aria-pressed="true"] { color: #fff; }
.seg button.must[aria-pressed="true"] { background: var(--accent); }
.seg button.nice[aria-pressed="true"] { background: var(--amber); }
.seg button.no[aria-pressed="true"]   { background: var(--faint); }

.note {
  width: 100%; border: 0; border-bottom: 1px dashed var(--line);
  background: transparent; color: var(--ink); font: inherit; font-size: 12.5px;
  padding: 3px 0; outline: none;
}
.note::placeholder { color: var(--faint); }
.note:focus { border-bottom-color: var(--accent); }

.empty { padding: 40px; text-align: center; color: var(--muted); }

/* ---------- legend + footer ---------- */
.legend {
  display: flex; flex-wrap: wrap; gap: 22px; margin-top: 16px;
  font-size: 12px; color: var(--muted);
}
.legend .grp { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.legend .lbl {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
}
.legend .item { display: inline-flex; align-items: center; gap: 5px; }

.notes {
  margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line);
  display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.notes h2 {
  font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  margin: 0 0 8px;
}
.notes p { margin: 0 0 9px; color: var(--muted); max-width: 60ch; }
.notes strong { color: var(--ink); font-weight: 600; }

.readonly-note {
  margin-top: 14px; padding: 10px 13px; border-left: 3px solid var(--amber);
  background: var(--amber-soft); color: var(--ink); font-size: 13px; border-radius: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- three-way review additions ---------- */
.chooser {
  margin-top: 16px; padding: 16px 18px; border-radius: 3px;
  background: var(--surface); border: 1px solid var(--accent);
  box-shadow: var(--shadow);
}
.chooser p { margin: 0 0 11px; font-size: 14px; }
.chooser .who { display: flex; gap: 9px; flex-wrap: wrap; }
.chooser button { height: 36px; padding: 0 18px; font-size: 14px; }
.chooser button:hover { background: var(--accent-soft); }

.me-field { border-color: var(--accent); }
.me-field select { color: var(--accent); font-weight: 600; }

.dcell { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.peers {
  display: flex; gap: 9px; font-family: "IBM Plex Mono", monospace;
  font-size: 10px; color: var(--faint); letter-spacing: .04em;
}
.peers span { display: inline-flex; align-items: center; gap: 3px; }
.peers b { font-weight: 500; }
.peers i { font-style: normal; font-size: 11px; line-height: 1; }
.peers .v-must { color: var(--accent); }
.peers .v-nice { color: var(--amber); }
.peers .v-no   { color: var(--faint); }
.peers .v-none { color: var(--line); }
.peers .self { color: var(--ink); }

.status {
  display: inline-block; font-family: "IBM Plex Mono", monospace;
  font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 2px; white-space: nowrap;
}
.st-agreed  { background: var(--accent-soft); color: var(--accent-ink); }
.st-split   { background: var(--amber-soft); color: var(--amber); }
.st-waiting { color: var(--faint); }

tbody tr.is-split td { background: var(--amber-soft); }
tbody tr.is-split:hover td { background: var(--amber-soft); filter: brightness(.985); }
tbody tr.is-split td.cap { box-shadow: inset 3px 0 0 var(--amber); }
tbody tr.is-agreed td.cap { box-shadow: inset 3px 0 0 var(--accent); }

.final { margin-top: 5px; }
.final .lbl {
  font-family: "IBM Plex Mono", monospace; font-size: 9.5px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--amber);
  display: block; margin-bottom: 3px;
}

button.primary {
  background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
}
button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

.chain {
  margin-top: 10px; font-family: "IBM Plex Mono", monospace;
  font-size: 11px; color: var(--faint);
}
.chain b { color: var(--muted); font-weight: 500; }

</style>
</head>

  var STATE = JSON.parse(document.getElementById("app-state").textContent);
  var STAMP = JSON.parse(document.getElementById("app-me").textContent);

  var REVIEWERS = ["Simon", "Camilla", "Angie"];
  if (!STATE.votes) STATE.votes = {};
  REVIEWERS.forEach(function (n) { if (!STATE.votes[n]) STATE.votes[n] = {}; });
  if (!STATE.final) STATE.final = {};
  if (!STATE.notes) STATE.notes = {};
  if (!STATE.chain) STATE.chain = [];

  var LS_KEY = "dream-os-capability-map";
  var ME_KEY = "dream-os-capability-map-me";
  var root = document.getElementById("root");

  var me = STAMP.me || "";
  try { me = me || localStorage.getItem(ME_KEY) || ""; } catch (e) {}
  if (REVIEWERS.indexOf(me) === -1) me = "";

  var ui = { q: "", group: "all", show: "all" };
  var artifactNs = null, downloadsNs = null;
  var filesMode = true, readOnly = false;
  var saveTimer = null, saveDelay = 2500;
  var dirty = false, storageOk = true;

  var COV = {
    "2":  { mark: "●", cls: "cov-2", label: "Yes" },
    "1":  { mark: "◐", cls: "cov-1", label: "Partial" },
    "0":  { mark: "○", cls: "cov-0", label: "No" },
    "-1": { mark: "?",      cls: "cov-u", label: "Not confirmed" }
  };
  var DREAM = {
    built:   { t: "Built",   c: "chip-built" },
    partial: { t: "Partial", c: "chip-partial" },
    planned: { t: "Planned", c: "chip-planned" },
    absent:  { t: "Not yet", c: "chip-absent" },
    na:      { t: "n/a",     c: "chip-na" }
  };
  var DECISIONS = [
    { k: "must", t: "Must", cls: "must" },
    { k: "nice", t: "Nice", cls: "nice" },
    { k: "no",   t: "No",   cls: "no" }
  ];
  var MARK = { must: "●", nice: "●", no: "○", "": "·" };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function statusOf(id) {
    var v = REVIEWERS.map(function (n) { return STATE.votes[n][id] || ""; });
    var filled = v.filter(Boolean);
    if (!filled.length) return "";
    if (filled.length < REVIEWERS.length) return "waiting";
    return (v[0] === v[1] && v[1] === v[2]) ? "agreed" : "split";
  }

  /* ---------- filtering ---------- */

  function visibleRows() {
    var q = ui.q.trim().toLowerCase();
    return DATA.rows.filter(function (r) {
      if (ui.group !== "all" && r.g !== ui.group) return false;
      var st = statusOf(r.id);
      if (ui.show === "split" && st !== "split") return false;
      if (ui.show === "open" && st === "agreed") return false;
      if (ui.show === "mine" && (me && STATE.votes[me][r.id])) return false;
      if (ui.show === "unsettled" && !(st === "split" && !STATE.final[r.id])) return false;
      if (ui.show === "gaps" && !(r.d === "absent" || r.d === "planned")) return false;
      if (q) {
        var hay = (r.n + " " + r.w + " " + (r.dn || "") + " " + r.id).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function counts() {
    var c = { agreed: 0, split: 0, waiting: 0, none: 0, mine: 0, unsettled: 0, total: DATA.rows.length };
    DATA.rows.forEach(function (r) {
      var st = statusOf(r.id);
      if (st === "agreed") c.agreed++;
      else if (st === "split") { c.split++; if (!STATE.final[r.id]) c.unsettled++; }
      else if (st === "waiting") c.waiting++;
      else c.none++;
      if (me && STATE.votes[me][r.id]) c.mine++;
    });
    return c;
  }

  /* ---------- render ---------- */

  function renderShell() {
    var c = counts();
    var groupOpts = ['<option value="all">All areas</option>'].concat(
      DATA.groups.map(function (g) {
        return '<option value="' + g.id + '">' + esc(g.name) + "</option>";
      })
    ).join("");
    var meOpts = ['<option value="">Not set</option>'].concat(
      REVIEWERS.map(function (n) { return '<option value="' + n + '">' + n + "</option>"; })
    ).join("");

    return [
      '<header class="masthead">',
        '<p class="eyebrow">Competitive capability map · three-way review</p>',
        "<h1>What the world's best agency systems do, and what Dream OS does</h1>",
        '<p class="standfirst">A hundred and twenty-two capabilities, drawn from the four systems worth learning from: <strong>BoldTrail</strong>, the American lead machine; <strong>Reapit</strong> and <strong>Street</strong>, which model the whole agency workflow the way Bronwyn actually works; and <strong>Entegral Base</strong>, the local incumbent at R949 a month. Simon, Camilla and Angie each vote in their own right — nobody overwrites anybody, and the page works out where you disagree.</p>',
      "</header>",

      '<div id="chooser"></div>',
      '<section class="summary" id="summary">' + statCards(c) + "</section>",
      '<div class="progress">',
        '<div class="bar">',
          '<i class="p-must" style="width:' + pct(c.agreed, c.total) + '%"></i>',
          '<i class="p-nice" style="width:' + pct(c.split, c.total) + '%"></i>',
          '<i class="p-no" style="width:' + pct(c.waiting, c.total) + '%"></i>',
        "</div>",
        '<p class="cap" id="progcap">' + progText(c) + "</p>",
      "</div>",

      '<div class="toolbar">',
        '<div class="field me-field"><label for="me">You are</label><select id="me">' + meOpts + "</select></div>",
        '<div class="field"><label for="q">Find</label>',
          '<input id="q" type="search" placeholder="commission, FICA, WhatsApp…" value="' + esc(ui.q) + '"></div>',
        '<div class="field"><label for="g">Area</label><select id="g">' + groupOpts + "</select></div>",
        '<div class="field"><label for="s">Show</label><select id="s">',
          '<option value="all">Everything</option>',
          '<option value="mine">I haven\'t voted</option>',
          '<option value="split">Where we disagree</option>',
          '<option value="unsettled">Splits with no final call</option>',
          '<option value="open">Not yet agreed</option>',
          '<option value="gaps">Dream OS gaps</option>',
        "</select></div>",
        '<button id="clear" type="button">Reset</button>',
        '<div class="spacer"></div>',
        '<button id="pass" type="button" class="primary">Save &amp; pass on</button>',
        '<button id="csv" type="button" hidden>CSV</button>',
        '<span class="savechip" id="savechip"></span>',
      "</div>",

      '<div id="ro"></div>',
      '<div class="tablewrap"><table id="grid"><thead>' + thead() + '</thead><tbody id="tbody"></tbody></table></div>',
      legend(),
      '<div class="chain" id="chain">' + chainText() + "</div>",
      footerNotes()
    ].join("");
  }

  function pct(n, total) { return total ? (n / total) * 100 : 0; }

  function progText(c) {
    return c.agreed + " agreed · " + c.split + " split" +
      (c.unsettled ? " (" + c.unsettled + " with no final call)" : "") +
      " · " + (c.waiting + c.none) + " still waiting on a vote";
  }

  function statCards(c) {
    return [
      { k: "Capabilities", v: c.total, cls: "" },
      { k: "Agreed", v: c.agreed, cls: "is-must" },
      { k: "We disagree", v: c.split, cls: "is-nice" },
      { k: "Awaiting votes", v: c.waiting + c.none, cls: "is-no" },
      { k: me ? me + "'s calls" : "Your calls", v: me ? c.mine : "—", cls: "" }
    ].map(function (s) {
      return '<div class="stat ' + s.cls + '"><span class="k">' + esc(s.k) + '</span><span class="v">' + s.v + "</span></div>";
    }).join("");
  }

  function thead() {
    var vend = DATA.vendors.map(function (v) {
      return '<th class="vend">' + esc(v.name) + '<span class="sub">' + esc(v.sub) + "</span></th>";
    }).join("");
    return "<tr>" +
      '<th class="cap-h">Capability<span class="sub">122 rows · 13 areas</span></th>' +
      vend +
      '<th class="dream">Dream OS<span class="sub">today</span></th>' +
      '<th class="dec">Your call<span class="sub">and everyone else’s</span></th>' +
      '<th class="note-h">Note</th>' +
      "</tr>";
  }

  function covCell(v) {
    var m = COV[String(v)] || COV["-1"];
    return '<td class="vend"><span class="cov ' + m.cls + '" title="' + m.label + '">' + m.mark + "</span></td>";
  }

  function renderBody() {
    var rows = visibleRows();
    var tbody = document.getElementById("tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td class="empty" colspan="8">Nothing matches that. Try resetting the filters.</td></tr>';
      return;
    }
    var byGroup = {};
    rows.forEach(function (r) { (byGroup[r.g] = byGroup[r.g] || []).push(r); });

    var html = "";
    DATA.groups.forEach(function (g) {
      var list = byGroup[g.id];
      if (!list || !list.length) return;
      html += '<tr class="group"><td colspan="8"><span class="gname">' + esc(g.name) +
              '</span> <span class="gcount">' + list.length + "</span></td></tr>";
      list.forEach(function (r) { html += rowHtml(r); });
    });
    tbody.innerHTML = html;
  }

  function rowHtml(r) {
    var mine = me ? (STATE.votes[me][r.id] || "") : "";
    var st = statusOf(r.id);
    var dm = DREAM[r.d] || DREAM.absent;
    var rowCls = st === "split" ? "is-split" : st === "agreed" ? "is-agreed" : "";

    var why = r.w ? '<div class="why">' + esc(r.w) + "</div>" : "";
    var dn = r.dn ? '<div class="why" style="opacity:.85"><em>' + esc(r.dn) + "</em></div>" : "";

    var seg = DECISIONS.map(function (d) {
      return '<button type="button" class="' + d.cls + '" data-dec="' + d.k + '" data-row="' + r.id +
             '" aria-pressed="' + (mine === d.k ? "true" : "false") + '"' +
             (me ? "" : " disabled") + ">" + d.t + "</button>";
    }).join("");

    var peers = REVIEWERS.map(function (n) {
      var v = STATE.votes[n][r.id] || "";
      return '<span' + (n === me ? ' class="self"' : "") + ' title="' + n + '"><b>' + n.charAt(0) +
             '</b><i class="v-' + (v || "none") + '">' + MARK[v] + "</i></span>";
    }).join("");

    var statusChip = st ? '<span class="status st-' + st + '">' +
      (st === "agreed" ? "Agreed" : st === "split" ? "Split" : "Waiting") + "</span>" : "";

    var final = "";
    if (st === "split") {
      var f = STATE.final[r.id] || "";
      final = '<div class="final"><span class="lbl">Final call</span><div class="seg">' +
        DECISIONS.map(function (d) {
          return '<button type="button" class="' + d.cls + '" data-final="' + d.k + '" data-row="' + r.id +
                 '" aria-pressed="' + (f === d.k ? "true" : "false") + '">' + d.t + "</button>";
        }).join("") + "</div></div>";
    }

    return '<tr class="' + rowCls + '">' +
      '<td class="cap"><div class="name"><span class="rowid">' + esc(r.id) + "</span>" + esc(r.n) + "</div>" + why + dn + "</td>" +
      covCell(r.bt) + covCell(r.rp) + covCell(r.st) + covCell(r.en) +
      '<td class="dreamc"><span class="chip ' + dm.c + '">' + dm.t + "</span></td>" +
      '<td><div class="dcell"><div class="seg">' + seg + '</div><div class="peers">' + peers +
        (statusChip ? " " + statusChip : "") + "</div>" + final + "</div></td>" +
      '<td><input class="note" data-row="' + esc(r.id) + '" value="' + esc(STATE.notes[r.id] || "") + '" placeholder="—"></td>' +
      "</tr>";
  }

  function legend() {
    var cov = Object.keys(COV).map(function (k) {
      var m = COV[k];
      return '<span class="item"><span class="cov ' + m.cls + '">' + m.mark + "</span>" + m.label + "</span>";
    }).join("");
    var dream = ["built", "partial", "planned", "absent"].map(function (k) {
      return '<span class="item"><span class="chip ' + DREAM[k].c + '">' + DREAM[k].t + "</span></span>";
    }).join("");
    var stat = ["agreed", "split", "waiting"].map(function (k) {
      return '<span class="item"><span class="status st-' + k + '">' + k + "</span></span>";
    }).join("");
    return '<div class="legend">' +
      '<span class="grp"><span class="lbl">Coverage</span>' + cov + "</span>" +
      '<span class="grp"><span class="lbl">Dream OS</span>' + dream + "</span>" +
      '<span class="grp"><span class="lbl">Between you</span>' + stat + "</span>" +
      "</div>";
  }

  function chainText() {
    if (!STATE.chain.length) return "Handoff log · nobody has passed this on yet.";
    return "Handoff log · " + STATE.chain.map(function (h) {
      return "<b>" + esc(h.who) + "</b> " + esc(h.when);
    }).join(" → ");
  }

  function footerNotes() {
    return '<section class="notes">' +
      "<div><h2>How the review works</h2>" +
      "<p>Set who you are, top left. You vote in your own right; the initials under each row show how the other two voted, and the page marks the row <strong>Split</strong> the moment all three are in and you don’t agree.</p>" +
      "<p>Filter to <strong>Where we disagree</strong> and you have your meeting agenda — the rest is settled.</p></div>" +

      "<div><h2>Passing it on</h2>" +
      "<p><strong>Save &amp; pass on</strong> writes a fresh file carrying everyone’s votes so far. Email that file to the next person; they open it, say who they are, and carry on.</p>" +
      "<p>One at a time. Two people working at once means two files and a hundred and twenty-two rows to reconcile by hand.</p>" +
      "<p>The chip beside that button says <strong>Not in a file yet</strong> whenever you have work that hasn’t been written out, and the browser will stop you closing the tab while it does.</p></div>" +

      "<div><h2>The three things nobody else does</h2>" +
      "<p>Erf and cadastral data, municipal valuation rolls, and FFC expiry on the practitioner record are ours alone across all four systems — as is treating freehold and sectional title as a structural distinction rather than a tag.</p></div>" +

      "<div><h2>Worth knowing before you vote</h2>" +
      "<p>A conveyancer may not pay commission to a practitioner without a valid Fidelity Fund Certificate on file. We already track the dates; gating the payout on them is small work with real legal weight, and no international system has the concept.</p>" +
      "<p>Since the 2023 Competition Commission ruling, Property24, Private Property and PropData must accept third-party listing feeds free of charge.</p></div>" +
      "</section>";
  }

  function renderChooser() {
    var el = document.getElementById("chooser");
    if (!el) return;
    if (me) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="chooser"><p><strong>Who is working on this?</strong> ' +
      "Pick yourself so your votes land in your own column and nobody overwrites anybody.</p>" +
      '<div class="who">' + REVIEWERS.map(function (n) {
        return '<button type="button" data-me="' + n + '">' + n + "</button>";
      }).join("") + "</div></div>";
  }

  /* ---------- persistence ---------- */

  function docHtml(stampMe) {
    var style = document.getElementById("app-style").textContent;
    var script = document.getElementById("app-script").textContent;
    var data = document.getElementById("app-data").textContent;
    var S = "<" + "/script>";
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<title>Dream OS Capability Map</title>\n" +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">\n' +
      '<style id="app-style">' + style + "</style>\n</head>\n<body>\n" +
      '<div class="wrap"><div id="root"></div></div>\n' +
      '<script id="app-data" type="application/json">' + data + S + "\n" +
      '<script id="app-me" type="application/json">' + JSON.stringify({ me: stampMe || "" }) + S + "\n" +
      '<script id="app-state" type="application/json">' + JSON.stringify(STATE) + S + "\n" +
      '<script id="app-script">' + script + S + "\n</body>\n</html>";
  }

  function chip(text, cls) {
    var el = document.getElementById("savechip");
    if (!el) return;
    el.textContent = text;
    el.className = "savechip" + (cls ? " " + cls : "");
  }

  function localSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
    catch (e) { storageOk = false; showStorageWarning(); }
  }

  function scheduleSave() {
    dirty = true;
    localSave();
    if (!artifactNs) { chip("Not in a file yet", "is-warn"); return; }
    chip("Saving…");
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(save, saveDelay);
  }

  function save() {
    if (readOnly || !artifactNs) return;
    var payload = filesMode ? { "data/decisions.json": JSON.stringify(STATE) } : docHtml("");
    if (!filesMode) {
      try { sessionStorage.setItem("dream-os-ui", JSON.stringify(ui)); } catch (e) {}
    }
    artifactNs.publish(payload).then(function () {
      dirty = false;
      chip("Saved for everyone", "is-on");
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") { chip("Reloading…"); return; }
      if (code === "not_writer" || code === "not_granted" ||
          code === "not_declared" || code === "consent_required") {
        readOnly = true; chip("Saved here"); showReadOnly(); return;
      }
      if (filesMode && (code === "capability_disabled" || code === "capability_removed" ||
                        code === "invalid_content" || code === "transform_error")) {
        filesMode = false; save(); return;
      }
      if (code === "rate_limited") {
        saveDelay = Math.min(saveDelay * 2, 20000);
        chip("Saving shortly…", "is-warn");
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(save, saveDelay);
        return;
      }
      chip("Saved here only", "is-warn");
    });
  }

  function showStorageWarning() {
    var el = document.getElementById("ro");
    if (!el || el.dataset.storage) return;
    el.dataset.storage = "1";
    el.innerHTML = '<div class="readonly-note"><strong>This browser will not remember your ticks.</strong> ' +
      "It is blocking local files from storing anything, so if you close this tab your work is gone. " +
      "Either open the file in Chrome instead, or click <strong>Save &amp; pass on</strong> every so often — " +
      "the file it writes keeps everything, and you can carry on in it." + "</div>";
  }

  function showReadOnly() {
    var el = document.getElementById("ro");
    if (!el || el.dataset.shown) return;
    el.dataset.shown = "1";
    el.innerHTML = '<div class="readonly-note">You can read this map but not change it here. Your votes are kept in this browser only.</div>';
  }

  function passOn() {
    if (!me) { renderChooser(); chip("Say who you are first", "is-warn"); return; }
    var now = new Date();
    var day = now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0");
    STATE.chain = STATE.chain.filter(function (h) { return h.who !== me; });
    STATE.chain.push({ who: me, when: day });
    localSave();
    document.getElementById("chain").innerHTML = chainText();

    var n = String(STATE.chain.length).padStart(2, "0");
    var filename = "Capability-Map-" + n + "-" + me + ".html";
    var html = docHtml("");

    if (downloadsNs) {
      downloadsNs.save({ filename: filename, data: html })
        .then(function () { dirty = false; chip("File ready to email", "is-on"); })
        .catch(function () { chip("Download refused", "is-warn"); });
      scheduleSave();
      return;
    }
    try {
      var blob = new Blob([html], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      dirty = false;
      chip("Saved as " + filename, "is-on");
    } catch (e) {
      chip("Could not write the file", "is-warn");
    }
  }

  /* ---------- events ---------- */

  function bind() {
    var q = document.getElementById("q");
    var g = document.getElementById("g");
    var s = document.getElementById("s");
    var m = document.getElementById("me");
    g.value = ui.group; s.value = ui.show; m.value = me;

    q.addEventListener("input", function () { ui.q = q.value; renderBody(); });
    g.addEventListener("change", function () { ui.group = g.value; renderBody(); });
    s.addEventListener("change", function () { ui.show = s.value; renderBody(); });
    m.addEventListener("change", function () { setMe(m.value); });
    document.getElementById("clear").addEventListener("click", function () {
      ui.q = ""; ui.group = "all"; ui.show = "all";
      q.value = ""; g.value = "all"; s.value = "all";
      renderBody();
    });
    document.getElementById("pass").addEventListener("click", passOn);

    window.addEventListener("beforeunload", function (e) {
      if (!dirty) return;
      e.preventDefault();
      e.returnValue = "";
      return "";
    });

    document.getElementById("chooser").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-me]");
      if (b) setMe(b.getAttribute("data-me"));
    });

    var body = document.getElementById("tbody");
    body.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-dec], button[data-final]");
      if (!btn) return;
      var id = btn.getAttribute("data-row");
      if (btn.hasAttribute("data-final")) {
        var fv = btn.getAttribute("data-final");
        if (STATE.final[id] === fv) delete STATE.final[id]; else STATE.final[id] = fv;
      } else {
        if (!me) { renderChooser(); return; }
        var v = btn.getAttribute("data-dec");
        if (STATE.votes[me][id] === v) delete STATE.votes[me][id];
        else STATE.votes[me][id] = v;
      }
      refreshCounts();
      renderBody();
      scheduleSave();
    });

    body.addEventListener("input", function (e) {
      var inp = e.target.closest("input.note");
      if (!inp) return;
      var id = inp.getAttribute("data-row");
      var v = inp.value.trim();
      if (v) STATE.notes[id] = v; else delete STATE.notes[id];
      scheduleSave();
    });
  }

  function setMe(v) {
    me = REVIEWERS.indexOf(v) === -1 ? "" : v;
    try { localStorage.setItem(ME_KEY, me); } catch (e) {}
    var sel = document.getElementById("me");
    if (sel) sel.value = me;
    renderChooser();
    refreshCounts();
    renderBody();
  }

  function refreshCounts() {
    var c = counts();
    document.getElementById("summary").innerHTML = statCards(c);
    var bar = document.querySelector(".progress .bar");
    if (bar) {
      bar.querySelector(".p-must").style.width = pct(c.agreed, c.total) + "%";
      bar.querySelector(".p-nice").style.width = pct(c.split, c.total) + "%";
      bar.querySelector(".p-no").style.width = pct(c.waiting, c.total) + "%";
    }
    var cap = document.getElementById("progcap");
    if (cap) cap.textContent = progText(c);
  }

  function csv() {
    var names = {};
    DATA.groups.forEach(function (g) { names[g.id] = g.name; });
    var LBL = { must: "Must have", nice: "Nice to have", no: "Not for us" };
    var head = ["ID", "Area", "Capability", "Why it matters"]
      .concat(DATA.vendors.map(function (v) { return v.name; }))
      .concat(["Dream OS today", "Dream OS note"])
      .concat(REVIEWERS)
      .concat(["Status", "Final call", "Note"]);
    var lines = [head];
    DATA.rows.forEach(function (r) {
      lines.push([
        r.id, names[r.g] || r.g, r.n, r.w,
        COV[String(r.bt)].label, COV[String(r.rp)].label,
        COV[String(r.st)].label, COV[String(r.en)].label,
        (DREAM[r.d] || DREAM.absent).t, r.dn || ""
      ].concat(REVIEWERS.map(function (n) { return LBL[STATE.votes[n][r.id]] || ""; }))
       .concat([statusOf(r.id), LBL[STATE.final[r.id]] || "", STATE.notes[r.id] || ""]));
    });
    return lines.map(function (row) {
      return row.map(function (cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
  }

  /* ---------- boot ---------- */

  try {
    var stashed = sessionStorage.getItem("dream-os-ui");
    if (stashed) { ui = JSON.parse(stashed); sessionStorage.removeItem("dream-os-ui"); }
  } catch (e) {}

  try {
    var local = localStorage.getItem(LS_KEY);
    if (local) {
      var p = JSON.parse(local);
      var empty = REVIEWERS.every(function (n) { return !Object.keys(STATE.votes[n]).length; });
      if (empty && p.votes) {
        REVIEWERS.forEach(function (n) { STATE.votes[n] = p.votes[n] || {}; });
        STATE.final = p.final || {};
        STATE.notes = p.notes || {};
        STATE.chain = p.chain || [];
      }
    }
  } catch (e) {}

  root.innerHTML = renderShell();
  renderChooser();
  renderBody();
  bind();
  chip("");

  try {
    localStorage.setItem(LS_KEY + "-probe", "1");
    localStorage.removeItem(LS_KEY + "-probe");
  } catch (e) { storageOk = false; showStorageWarning(); }

  if (window.claude) fetch("data/decisions.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (saved) {
      if (!saved) return;
      REVIEWERS.forEach(function (n) { STATE.votes[n] = (saved.votes && saved.votes[n]) || {}; });
      STATE.final = saved.final || {};
      STATE.notes = saved.notes || {};
      STATE.chain = saved.chain || [];
      localSave();
      refreshCounts();
      renderBody();
      document.getElementById("chain").innerHTML = chainText();
    })
    .catch(function () {});

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      if (ns) artifactNs = ns; else chip("Saved here");
    }).catch(function () {});
    window.claude.use("downloads").then(function (dl) {
      if (!dl) return;
      downloadsNs = dl;
      var btn = document.getElementById("csv");
      if (!btn) return;
      btn.hidden = false;
      btn.addEventListener("click", function () {
        dl.save({ filename: "dream-os-capability-map.csv", data: csv() }).catch(function () {});
      });
    }).catch(function () {});
  } else {
    var btn = document.getElementById("csv");
    if (btn) {
      btn.hidden = false;
      btn.addEventListener("click", function () {
        try {
          var blob = new Blob([csv()], { type: "text/csv" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "dream-os-capability-map.csv";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        } catch (e) {}
      });
    }
  }
})();

</script>
</body>
</html>
